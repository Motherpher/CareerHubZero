schema_version: "1.0"
index_id: CHZERO-FAIL-INDEX-001
cutoff_date: "2026-10-07"
search_contract: >-
  Search by observed symptom, error text, subsystem, WP, issue/PR, commit,
  profile, provider or state contradiction. Resolved failures remain searchable.

classes:
  ARCH_DRIFT: canonical architecture drift or duplicate authority
  EXEC_PATH: dispatch/execution path failure
  PERSISTENCE: durable state/result materialisation failure
  SURFACE: absent, opaque or misleading user-facing behaviour
  INTEGRATION: external provider/repository/deployment integration failure
  DATA_BOUNDARY: profile/evidence/privacy/isolation boundary failure or risk
  BUILD: build/package/runtime-resolution failure
  SEARCH: sourcing/query/delta/filter/result-quality failure
  AUDIT_STATE: stale/conflicting audit or governance state
  MIGRATION: legacy Motor/metadata/cutover failure
  DEVELOPMENT_PROCESS: branch/PR/process failure
  RELEASE_STATE: audit/release/version divergence

