name: CareerHub — Validate Unified Body

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "VERSION"
      - "src/**"
      - "core/**"
      - "schemas/**"
      - "scripts/**"
      - "stack/**"
      - "docs/BODY_ARCHITECTURE.md"
      - "requirements.txt"

permissions:
  contents: read

jobs:
  validate-body:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate unified CareerHub body
        run: python scripts/check_body_version.py

      - name: Run regression suite
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Stable-release guard
        run: |
          VERSION="$(cat VERSION)"
          if [ "$VERSION" = "1.0.0" ]; then
            if [ ! -f stack/FULL_AUDIT_PASS.yaml ]; then
              echo "::error::CareerHub 1.0.0 requires stack/FULL_AUDIT_PASS.yaml."
              exit 1
            fi
            python - <<'PY'
          import yaml
          from pathlib import Path
          data=yaml.safe_load(Path("stack/FULL_AUDIT_PASS.yaml").read_text(encoding="utf-8")) or {}
          if data.get("status") != "PASS":
              raise SystemExit("FULL_AUDIT_PASS.yaml does not record status: PASS")
          print("Full Audit Lock PASS recorded.")
          PY
          else
            echo "Pre-1.0 body validation complete; no stable release tag created."
          fi
