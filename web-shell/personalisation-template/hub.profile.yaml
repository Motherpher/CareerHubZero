schema_version: "1.0"

identity:
  display_name: "CareerHub User"
  strapline: "A career workspace shaped around how this person actually works."
  language: "en"

experience:
  mode: "editorial"
  density: "balanced"
  guidance: "standard"
  motion: "subtle"

home:
  headline: "Career, in motion."
  intro: "Find relevant work, understand what the role actually asks for, and move from evidence to application without losing the thread."
  slots:
