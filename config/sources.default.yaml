schema_version: "1.0"
updated: "2026-09-23"

providers:
  platsbanken:
    enabled: true
    mode: "public_api"
    label: "Arbetsförmedlingen / Platsbanken"
    endpoint: "https://jobsearch.api.jobtechdev.se/search"
    credentials: []
    attribution_required: false

  remotive:
    enabled: true
    mode: "public_api"
    label: "Remotive"
    endpoint: "https://remotive.com/api/remote-jobs"
    credentials: []
    attribution_required: true
    max_requests_per_day: 4

  remoteok:
    enabled: true
    mode: "public_json"
    label: "Remote OK"
    endpoint: "https://remoteok.com/api"
    credentials: []
    attribution_required: true

  weworkremotely:
    enabled: true
    mode: "rss"
    label: "We Work Remotely"
    endpoint: "https://weworkremotely.com/remote-jobs.rss"
    credentials: []
    attribution_required: true

  adzuna:
    enabled: false
    mode: "api_key"
    label: "Adzuna"
    endpoint_template: "https://api.adzuna.com/v1/api/jobs/{country}/search/1"
    credentials: [ADZUNA_APP_ID, ADZUNA_APP_KEY]
    attribution_required: true

  jooble:
    enabled: false
    mode: "regional_api_key"
    label: "Jooble"
    endpoint_env: "JOOBLE_API_ENDPOINT"
    credentials: [JOOBLE_API_KEY, JOOBLE_API_ENDPOINT]
    attribution_required: true

  indeed:
    enabled: false
    mode: "manual"
    label: "Indeed"
    search_url: "https://se.indeed.com/jobs"

  linkedin_jobs:
    enabled: false
    mode: "manual"
    label: "LinkedIn Jobs"
    search_url: "https://www.linkedin.com/jobs/"

generic_public_url:
  obey_robots: true
  bypass_authentication: false
  bypass_paywalls: false
  extract:
    - "JSON-LD JobPosting"
    - "OpenGraph metadata"
    - "page title"
    - "public visible job text"
