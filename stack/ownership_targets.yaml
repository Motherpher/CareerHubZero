    current: Motherpher/CareerHubZero
    target: Motherpher/CareerHubZero
    strategy: already_canonical
    status: complete

  - instance_id: linus-fast
    current: Motherpher/CareerHub-LinusF
    target: Motherpher/CareerHub-LinusF
    strategy: already_canonical
    status: complete

  - instance_id: weronika-perez-borjas
    previous: Hybrismannen/wpb
    target: Motherpher/CareerHub-Weronika
    strategy: extract_profile_subtree_to_dedicated_repository
    user_reported_move_complete: true
    status: blocked_connector_visibility
    note: "Old Hybrismannen/wpb location no longer resolves through the connector. Exact Motherpher repository name/path must be verified after the GitHub installation is granted access."

  - instance_id: grace
    previous: Hybrismannen/Gracey
    target: Motherpher/CareerHub-Grace
