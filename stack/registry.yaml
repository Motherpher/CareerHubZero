schema_version: "2.0"
product: careerhub
version_source: VERSION
architecture: unified_body
rule: "CareerHub has one software version. Profile repositories contain data/context manifests only and do not pin or fork the runtime."

profiles:
  - profile_id: linus-fast
    repository: Motherpher/CareerHub-LinusF
    manifest_path: careerhub.yaml
    status: active
    migration:
      legacy_instance_path: instance.yaml
      legacy_lock_path: stack.lock.yaml
      legacy_motor_present: false

  - profile_id: weronika-perez-borjas
    repository: Motherpher/wpb
    manifest_path: CareerHub/careerhub.yaml
    status: active
    migration:
      legacy_instance_path: CareerHub/instance.yaml
      legacy_lock_path: CareerHub/stack.lock.yaml
      legacy_motor_present: true

  - profile_id: grace
    repository: Motherpher/Gracey
    manifest_path: CareerHub/careerhub.yaml
    status: active
    migration:
      legacy_instance_path: CareerHub/instance.yaml
      legacy_lock_path: CareerHub/stack.lock.yaml
      legacy_motor_present: true
