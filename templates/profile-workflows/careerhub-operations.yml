name: CareerHub · Operations
run-name: CareerHub ${{ inputs.operation }} · ${{ inputs.action_id }}

on:
  workflow_dispatch:
    inputs:
      operation:
        required: true
        type: string
      action_id:
        required: true
        type: string
      payload:
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: careerhub-operations-${{ github.ref }}
  cancel-in-progress: false

jobs:
  operate:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      CAREERHUB_MODEL: ${{ secrets.CAREERHUB_MODEL }}
      OPERATION: ${{ inputs.operation }}
      ACTION_ID: ${{ inputs.action_id }}
      PAYLOAD: ${{ inputs.payload }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: Motherpher/CareerHubZero
          ref: main
          path: .careerhub-zero
      - name: Resolve profile root
        shell: bash
        run: |
          if [ -f careerhub.yaml ]; then
            echo "CAREERHUB_ROOT=." >> "$GITHUB_ENV"
            echo "CAREERHUB_MANIFEST=careerhub.yaml" >> "$GITHUB_ENV"
          elif [ -f CareerHub/careerhub.yaml ]; then
            echo "CAREERHUB_ROOT=CareerHub" >> "$GITHUB_ENV"
            echo "CAREERHUB_MANIFEST=CareerHub/careerhub.yaml" >> "$GITHUB_ENV"
          else
            echo "No careerhub.yaml manifest found." >&2
            exit 1
          fi
      - name: Install central motor
        run: python -m pip install -r .careerhub-zero/requirements.txt
      - name: Verify HRDM semantic dependency
        if: inputs.operation == 'analyse_role'
        shell: bash
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY is not configured for this profile repository." >&2
            exit 1
          fi
      - name: Decode action payload
        shell: bash
        run: |
          mkdir -p /tmp/careerhub-action
          python - <<'PY'
          import json, os, pathlib
          p = json.loads(os.environ['PAYLOAD'] or '{}')
          root = pathlib.Path('/tmp/careerhub-action')
          for key, value in p.items():
              if isinstance(value, (dict, list)):
                  value = json.dumps(value, ensure_ascii=False)
              (root / f'{key}.txt').write_text(str(value or ''), encoding='utf-8')
          (root / 'payload.json').write_text(json.dumps(p, ensure_ascii=False, indent=2), encoding='utf-8')
          PY
      - name: Execute motor action
        shell: bash
        env:
          PYTHONPATH: .careerhub-zero/src
        run: |
          getv() { [ -f "/tmp/careerhub-action/$1.txt" ] && cat "/tmp/careerhub-action/$1.txt" || true; }
          case "$OPERATION" in
            analyse_role)
              URL="$(getv job_url)"; TITLE="$(getv title)"; COMPANY="$(getv company)"; DEADLINE="$(getv deadline)"; LANE="$(getv lane)"
              [ -n "$URL" ] || URL="https://careerhub.local/manual-role"
              [ -n "$LANE" ] || LANE="core"
              cp /tmp/careerhub-action/job_text.txt /tmp/careerhub-job.txt 2>/dev/null || : > /tmp/careerhub-job.txt
              OUT_REL="output/$ACTION_ID"
              python .careerhub-zero/scripts/careerhub.py --manifest "$CAREERHUB_MANIFEST" drill --url "$URL" --text-file /tmp/careerhub-job.txt --title "$TITLE" --company "$COMPANY" --deadline "$DEADLINE" --lane "$LANE" --out "$OUT_REL"
              python .careerhub-zero/scripts/bind_web_action.py --manifest "$CAREERHUB_MANIFEST" --out "$OUT_REL" --case-id "${GITHUB_RUN_ID}" --case-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --priority 3
              ;;
            track_status)
              python .careerhub-zero/scripts/careerhub.py --manifest "$CAREERHUB_MANIFEST" track --action status --issue-number "$(getv issue_number)" --status "$(getv status)" --date "$(getv date)" --next-action "$(getv next_action)" --next-action-date "$(getv next_action_date)"
              ;;
            track_priority)
              python .careerhub-zero/scripts/careerhub.py --manifest "$CAREERHUB_MANIFEST" track --action priority --issue-number "$(getv issue_number)" --priority "$(getv priority)"
              ;;
            track_event)
              python .careerhub-zero/scripts/careerhub.py --manifest "$CAREERHUB_MANIFEST" track --action event --issue-number "$(getv issue_number)" --event-type "$(getv event_type)" --event-source "$(getv event_source)" --note "$(getv note)" --date "$(getv date)"
              ;;
            search_profile_update)
              python .careerhub-zero/scripts/update_search_profile.py --manifest "$CAREERHUB_MANIFEST" --anchors "$(getv anchors)" --remote-allowed "$(getv remote_allowed)" --engagement-types "$(getv engagement_types)" --saved-need "$(getv saved_need)"
              ;;
            profile_review|profile_rebuild|library_review)
              mkdir -p "$CAREERHUB_ROOT/data/review_requests"
              cp /tmp/careerhub-action/payload.json "$CAREERHUB_ROOT/data/review_requests/${ACTION_ID}.json"
              ;;
            *) echo "Unsupported operation: $OPERATION" >&2; exit 2 ;;
          esac
      - name: Mirror generated artifacts into deployable site
        shell: bash
        run: |
          MIRROR="$CAREERHUB_ROOT/site/.careerhub-artifacts"
          rm -rf "$MIRROR"
          mkdir -p "$MIRROR/output" "$MIRROR/reports"
          if [ -d "$CAREERHUB_ROOT/output" ]; then cp -a "$CAREERHUB_ROOT/output/." "$MIRROR/output/"; fi
          if [ -d "$CAREERHUB_ROOT/reports" ]; then cp -a "$CAREERHUB_ROOT/reports/." "$MIRROR/reports/"; fi
      - name: Commit CareerHub state and artifacts
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A "$CAREERHUB_ROOT/config" "$CAREERHUB_ROOT/data" "$CAREERHUB_ROOT/reports" "$CAREERHUB_ROOT/output" "$CAREERHUB_ROOT/site/.careerhub-artifacts" "$CAREERHUB_ROOT/CONTROL_ROOM.md" "$CAREERHUB_ROOT/APPLICATIONS.md" "$CAREERHUB_ROOT/JOB_VAULT.md" 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No repository state changes."
            exit 0
          fi
          git commit -m "CareerHub: ${OPERATION} ${ACTION_ID}"
          git pull --rebase origin main
          git push origin HEAD:main
