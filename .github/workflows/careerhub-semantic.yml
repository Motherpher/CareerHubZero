name: CareerHub · Semantic Motor
run-name: CareerHub semantic · ${{ inputs.action_id }} · ${{ inputs.profile_repository }}

on:
  workflow_dispatch:
    inputs:
      action_id:
        required: true
        type: string
      profile_repository:
        required: true
        type: string
      payload:
        required: true
        type: string
      result_upload_url:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: careerhub-semantic-${{ inputs.profile_repository }}-${{ inputs.action_id }}
  cancel-in-progress: false

jobs:
  semantic:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      CAREERHUB_MODEL: ${{ secrets.CAREERHUB_MODEL }}
      ACTION_ID: ${{ inputs.action_id }}
      PROFILE_REPOSITORY: ${{ inputs.profile_repository }}
      PAYLOAD: ${{ inputs.payload }}
    steps:
      - name: Mask semantic handoff credential
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          event = json.load(open(os.environ['GITHUB_EVENT_PATH'], encoding='utf-8'))
          url = str((event.get('inputs') or {}).get('result_upload_url') or '')
          if not url:
              raise SystemExit('Semantic result upload URL is missing.')
          print(f'::add-mask::{url}')
          PY

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify central semantic dependency
        shell: bash
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY is not configured in CareerHubZero." >&2
            exit 1
          fi

      - name: Clone profile state repository
        shell: bash
        run: |
          case "$PROFILE_REPOSITORY" in
            Motherpher/*) ;;
            *) echo "Profile repository is outside the governed Motherpher namespace." >&2; exit 1 ;;
          esac
          git clone --depth 1 "https://github.com/${PROFILE_REPOSITORY}.git" .profile
          if [ -f .profile/careerhub.yaml ]; then
            echo "CAREERHUB_ROOT_FS=.profile" >> "$GITHUB_ENV"
            echo "CAREERHUB_MANIFEST=.profile/careerhub.yaml" >> "$GITHUB_ENV"
          elif [ -f .profile/CareerHub/careerhub.yaml ]; then
            echo "CAREERHUB_ROOT_FS=.profile/CareerHub" >> "$GITHUB_ENV"
            echo "CAREERHUB_MANIFEST=.profile/CareerHub/careerhub.yaml" >> "$GITHUB_ENV"
          else
            echo "No careerhub.yaml manifest found in profile repository." >&2
            exit 1
          fi

      - name: Install canonical Motor
        run: python -m pip install -r requirements.txt

      - name: Decode action payload
        shell: bash
        run: |
          mkdir -p /tmp/careerhub-action
          python - <<'PY'
          import json, os, pathlib
          payload = json.loads(os.environ['PAYLOAD'] or '{}')
          root = pathlib.Path('/tmp/careerhub-action')
          for key, value in payload.items():
              if isinstance(value, (dict, list)):
                  value = json.dumps(value, ensure_ascii=False)
              (root / f'{key}.txt').write_text(str(value or ''), encoding='utf-8')
          (root / 'payload.json').write_text(json.dumps(payload, ensure_ascii=False, indent=2), encoding='utf-8')
          PY

      - name: Execute canonical Job Analysis
        shell: bash
        env:
          PYTHONPATH: src
        run: |
          getv() { [ -f "/tmp/careerhub-action/$1.txt" ] && cat "/tmp/careerhub-action/$1.txt" || true; }
          URL="$(getv job_url)"; TITLE="$(getv title)"; COMPANY="$(getv company)"; DEADLINE="$(getv deadline)"; LANE="$(getv lane)"
          [ -n "$URL" ] || URL="https://careerhub.local/manual-role"
          [ -n "$LANE" ] || LANE="core"
          cp /tmp/careerhub-action/job_text.txt /tmp/careerhub-job.txt 2>/dev/null || : > /tmp/careerhub-job.txt
          OUT_REL="output/$ACTION_ID"
          python scripts/web_analysis.py --manifest "$CAREERHUB_MANIFEST" --url "$URL" --text-file /tmp/careerhub-job.txt --title "$TITLE" --company "$COMPANY" --deadline "$DEADLINE" --lane "$LANE" --out "$OUT_REL" --library-evidence-file /tmp/careerhub-action/library_evidence.txt
          python scripts/bind_web_action.py --manifest "$CAREERHUB_MANIFEST" --out "$OUT_REL" --case-id "${GITHUB_RUN_ID}" --case-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --priority 3

      - name: Verify semantic completion and evidence trace
        shell: bash
        run: |
          python - <<'PY'
          import json, os, pathlib
          root = pathlib.Path(os.environ['CAREERHUB_ROOT_FS']) / 'output' / os.environ['ACTION_ID']
          result_path = root / 'HRDM_result.json'
          evidence_path = root / 'evidence_use_manifest.json'
          if not result_path.exists():
              raise SystemExit('HRDM_result.json was not generated.')
          if not evidence_path.exists():
              raise SystemExit('evidence_use_manifest.json was not generated.')
          result = json.loads(result_path.read_text(encoding='utf-8'))
          evidence = json.loads(evidence_path.read_text(encoding='utf-8'))
          payload = json.loads(os.environ['PAYLOAD'] or '{}')
          requested = payload.get('library_evidence') or {}
          if result.get('ai_status') == 'not_run':
              raise SystemExit('Semantic HRDM did not execute; fallback output is forbidden for web completion.')
          if not (result.get('process_id') or (result.get('trace') or {}).get('process_id')):
              raise SystemExit('Semantic HRDM result is missing Process-ID trace identity.')
          expected_ids = list(requested.get('source_ids') or [])
          actual_ids = [source.get('source_id') for source in evidence.get('sources') or []]
          if actual_ids != expected_ids:
              raise SystemExit(f'Evidence-use manifest mismatch: expected {expected_ids}, got {actual_ids}')
          print(f'Semantic Job Analysis verified with {len(actual_ids)} ACTIVE Library evidence sources.')
          PY

      - name: Mirror generated artifacts into deployable profile shell
        shell: bash
        run: |
          MIRROR="$CAREERHUB_ROOT_FS/site/.careerhub-artifacts"
          rm -rf "$MIRROR"
          mkdir -p "$MIRROR/output" "$MIRROR/reports"
          if [ -d "$CAREERHUB_ROOT_FS/output" ]; then cp -a "$CAREERHUB_ROOT_FS/output/." "$MIRROR/output/"; fi
          if [ -d "$CAREERHUB_ROOT_FS/reports" ]; then cp -a "$CAREERHUB_ROOT_FS/reports/." "$MIRROR/reports/"; fi

      - name: Build governed result bundle
        shell: bash
        run: |
          python - <<'PY'
          import base64, json, os, pathlib, subprocess
          repo = pathlib.Path('.profile').resolve()
          root = pathlib.Path(os.environ['CAREERHUB_ROOT_FS']).resolve()
          action_id = os.environ['ACTION_ID']
          def names(args):
              raw = subprocess.check_output(['git', '-C', str(repo), *args])
              return [pathlib.Path(x.decode('utf-8')) for x in raw.split(b'\0') if x]
          changed = set(names(['diff', '--name-only', '--diff-filter=ACMRTUXB', '-z', 'HEAD']))
          changed.update(names(['ls-files', '--others', '--exclude-standard', '-z']))
          deleted = set(names(['diff', '--name-only', '--diff-filter=D', '-z', 'HEAD']))
          canonical_output = root / 'output' / action_id
          if canonical_output.exists():
              for absolute in canonical_output.rglob('*'):
                  if absolute.is_file(): changed.add(absolute.resolve().relative_to(repo))
          files = []
          deleted_paths = []
          for relative_repo in sorted(changed, key=lambda p: p.as_posix()):
              absolute = (repo / relative_repo).resolve()
              try: relative_profile = absolute.relative_to(root)
              except ValueError: continue
              if not absolute.is_file(): continue
              files.append({'path': relative_profile.as_posix(), 'encoding': 'base64', 'content': base64.b64encode(absolute.read_bytes()).decode('ascii')})
          for relative_repo in sorted(deleted, key=lambda p: p.as_posix()):
              absolute = (repo / relative_repo).resolve()
              try: relative_profile = absolute.relative_to(root)
              except ValueError: continue
              deleted_paths.append(relative_profile.as_posix())
          output = root / 'output' / action_id
          hrdm_path = output / 'HRDM_result.json'
          application_path = output / 'application_package.json'
          evidence_path = output / 'evidence_use_manifest.json'
          bundle = {
              'schema_version': '1.1', 'action_id': action_id, 'profile_repository': os.environ['PROFILE_REPOSITORY'],
              'generated_at': __import__('datetime').datetime.now(__import__('datetime').timezone.utc).isoformat(),
              'files': files, 'deleted_paths': deleted_paths,
              'hrdm': json.loads(hrdm_path.read_text(encoding='utf-8')),
              'application': json.loads(application_path.read_text(encoding='utf-8')) if application_path.exists() else None,
              'evidence_use_manifest': json.loads(evidence_path.read_text(encoding='utf-8')),
          }
          out = pathlib.Path('/tmp/careerhub-semantic-result.json')
          out.write_text(json.dumps(bundle, ensure_ascii=False, separators=(',', ':')), encoding='utf-8')
          print(json.dumps({'files': len(files), 'deleted_paths': len(deleted_paths), 'evidence_sources': bundle['evidence_use_manifest'].get('source_count', 0), 'bundle_bytes': out.stat().st_size}, indent=2))
          PY

      - name: Upload result bundle to profile private storage
        shell: bash
        run: |
          python - <<'PY'
          import json, os, pathlib, urllib.request
          event = json.load(open(os.environ['GITHUB_EVENT_PATH'], encoding='utf-8'))
          url = str((event.get('inputs') or {}).get('result_upload_url') or '')
          if not url:
              raise SystemExit('Semantic result upload URL is missing.')
          data = pathlib.Path('/tmp/careerhub-semantic-result.json').read_bytes()
          request = urllib.request.Request(url, data=data, method='PUT', headers={'content-type': 'application/json'})
          with urllib.request.urlopen(request, timeout=60) as response:
              if response.status < 200 or response.status >= 300:
                  raise SystemExit(f'Semantic result upload returned HTTP {response.status}.')
          print('Semantic result bundle uploaded.')
          PY
